services:
  postgres-test:
    image: postgres:16-alpine
    container_name: cuentame-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cuentame_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cuentame_test"]
      interval: 1s
      timeout: 3s
      retries: 30
